[project]
name = "henry-m4-multimodal-architecture"
version = "0.1.0"
description = "Módulo 4: AI Engineering - Visión, Audio, MCP y Arquitecturas Avanzadas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
    "google-genai>=2.31.0",
    "groq>=1.7.0",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/henry_m4"]
